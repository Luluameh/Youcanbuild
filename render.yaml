# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect repo → New → Blueprint (or Static Site linked to this file).

services:
  - type: web
    name: youcanbuild
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    previews:
      generation: automatic
    envVars:
      - key: VITE_STELLAR_NETWORK
        value: testnet
      - key: VITE_STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: VITE_STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: VITE_STELLAR_NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: VITE_STELLAR_EXPLORER_URL
        value: https://stellar.expert/explorer/testnet
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
